name: First Workflow via az login

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev

jobs:
  first-job:
    runs-on: ubuntu-latest

    # This is required to access secrets stored
    # under the selected GitHub Environment
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Test Azure Login
        run: |
          echo "Selected GitHub environment: ${{ inputs.environment }}"
          echo "===== Azure Account ====="
          az account show --output table

          echo "===== Resource Groups ====="
          az group list --output table
